name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c requirements-lock.txt -e ".[dev]"
      - run: ruff check .
      - run: mypy deliverybrief
      - run: pytest --junitxml=output/reliability-tests.xml
      - run: python scripts/summarize_reliability.py
      - run: python scripts/check_secrets.py
