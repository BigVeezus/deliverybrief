[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deliverybrief"
version = "0.1.0"
description = "Evidence-grounded weekly client updates from GitHub and project notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.75,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.42,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
deliverybrief-evaluate = "deliverybrief.evaluation:main"

[tool.setuptools.packages.find]
include = ["deliverybrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_submission_documents.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deliverybrief"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.oauth2.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
